<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collection - Alyra Sustainable Fashion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Lora&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Lora', serif;
      background: #e0f2f1; /* ocean green light background */
      color: #004d40; /* ocean green dark */
    }
    .masonry {
      column-count: 3;
      column-gap: 1rem;
    }
    @media (max-width: 768px) {
      .masonry {
        column-count: 1;
      }
    }
    .product-card {
      break-inside: avoid;
      margin-bottom: 1rem;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      background: white;
      transition: transform 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-5px);
    }
    .product-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-bottom: 4px solid #00796b;
    }
    .filter-btn {
      background-color: #b2dfdb;
      color: #00796b;
      border-radius: 9999px;
      padding: 0.5rem 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background-color: #00796b;
      color: #b2dfdb;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-teal-100 via-green-100 to-sand-100 min-h-screen">
  <header class="sticky top-0 bg-green-50 bg-opacity-90 backdrop-blur-md shadow-md z-50">
    <nav class="container mx-auto flex items-center justify-between py-4 px-6">
      <div class="flex items-center space-x-3">
        <img src="assets/image/logo.png" alt="Alyra Logo" class="h-12 w-12 object-contain" />
        <div class="text-3xl font-dm-serif font-semibold text-teal-800 select-none">ALYRA</div>
      </div>
      <ul class="flex space-x-8 text-teal-700 font-semibold text-lg">
        <li><a href="index.html#home" class="flex items-center space-x-2"><i class="fas fa-home"></i><span>Home</span></a></li>
        <li><a href="about.html" class="flex items-center space-x-2"><i class="fas fa-info-circle"></i><span>About</span></a></li>
        <li><a href="collection.html" class="flex items-center space-x-2"><i class="fas fa-tshirt"></i><span>Collection</span></a></li>
        <li><a href="sustainability.html" class="flex items-center space-x-2"><i class="fas fa-leaf"></i><span>Sustainability</span></a></li>
        <li><a href="contact.html" class="flex items-center space-x-2"><i class="fas fa-envelope"></i><span>Contact</span></a></li>
        <li><a href="cart.html" class="flex items-center space-x-2"><i class="fas fa-shopping-cart"></i><span>Cart</span></a></li>
      </ul>
    </nav>
  </header>

  <main class="container mx-auto px-6 py-12">
    <h1 class="text-4xl font-dm-serif text-ocean-teal mb-8 text-center">Our Collection</h1>

    <!-- Filters -->
    <div class="flex justify-center space-x-4 mb-8 flex-wrap">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="fluid-forms">Fluid Forms</button>
      <button class="filter-btn" data-filter="ocean-breath">Ocean Breath</button>
      <button class="filter-btn" data-filter="tideflow">Tideflow</button>
      <button class="filter-btn" data-filter="color-green">Green</button>
      <button class="filter-btn" data-filter="color-beige">Beige</button>
      <button class="filter-btn" data-filter="fabric-algae">Algae Fabric</button>
      <button class="filter-btn" data-filter="availability-inquire">Inquire Now</button>
    </div>

    <!-- Masonry Product Cards -->
    <div class="masonry" id="productGrid">
      <div class="product-card fluid-forms color-green fabric-algae availability-inquire">
        <img src="assets/image/dress1.jpg" alt="Ocean Breeze Dress" class="product-image" />
        <div class="p-4">
          <h2 class="font-semibold text-lg italic">Ocean Breeze Dress</h2>
          <button onclick="location.href='product-detail.html?product=ocean-breeze-dress'" class="mt-2 px-4 py-2 border border-green-700 rounded-full text-green-700 hover:bg-green-700 hover:text-white transition">Inquire Now</button>
        </div>
      </div>
      <div class="product-card ocean-breath color-beige fabric-algae availability-inquire">
        <img src="assets/image/kaftan1.jpg" alt="Algae Flow Dress" class="product-image" />
        <div class="p-4">
          <h2 class="font-semibold text-lg italic">Algae Flow Dress</h2>
          <button class="mt-2 px-4 py-2 border border-green-700 rounded-full text-green-700 hover:bg-green-700 hover:text-white transition">Inquire Now</button>
        </div>
      </div>
      <div class="product-card tideflow color-green fabric-algae availability-inquire">
        <img src="assets/image/top1.jpg" alt="Seafoam Breeze Top" class="product-image" />
        <div class="p-4">
          <h2 class="font-semibold text-lg italic">Seafoam Breeze Top</h2>
          <button class="mt-2 px-4 py-2 border border-green-700 rounded-full text-green-700 hover:bg-green-700 hover:text-white transition">Inquire Now</button>
        </div>
      </div>
      <div class="product-card tideflow color-green fabric-algae availability-inquire">
        <img src="assets/image/team1.jpg" alt="Coral Reef Dress" class="product-image" />
        <div class="p-4">
          <h2 class="font-semibold text-lg italic">Coral Reef Dress</h2>
          <button class="mt-2 px-4 py-2 border border-green-700 rounded-full text-green-700 hover:bg-green-700 hover:text-white transition">Inquire Now</button>
        </div>
      </div>
      <div class="product-card tideflow color-green fabric-algae availability-inquire">
        <img src="assets/image/team2.jpg" alt="Algae Bloom Dress" class="product-image" />
        <div class="p-4">
          <h2 class="font-semibold text-lg italic">Algae Bloom Dress</h2>
          <button class="mt-2 px-4 py-2 border border-green-700 rounded-full text-green-700 hover:bg-green-700 hover:text-white transition">Inquire Now</button>
        </div>
      </div>
      <div class="product-card tideflow color-green fabric-algae availability-inquire">
        <img src="assets/image/team3.jpg" alt="Seaside Serenity Dress" class="product-image" />
        <div class="p-4">
          <h2 class="font-semibold text-lg italic">Seaside Serenity Dress</h2>
          <button class="mt-2 px-4 py-2 border border-green-700 rounded-full text-green-700 hover:bg-green-700 hover:text-white transition">Inquire Now</button>
        </div>
      </div>
      <div class="product-card tideflow color-green fabric-algae availability-inquire">
        <img src="assets/image/blog1.jpg" alt="Ocean Mist Dress" class="product-image" />
        <div class="p-4">
          <h2 class="font-semibold text-lg italic">Ocean Mist Dress</h2>
          <button class="mt-2 px-4 py-2 border border-green-700 rounded-full text-green-700 hover:bg-green-700 hover:text-white transition">Inquire Now</button>
        </div>
      </div>
      <div class="product-card tideflow color-green fabric-algae availability-inquire">
        <img src="assets/image/blog2.jpg" alt="Tidal Wave Dress" class="product-image" />
        <div class="p-4">
          <h2 class="font-semibold text-lg italic">Tidal Wave Dress</h2>
          <button class="mt-2 px-4 py-2 border border-green-700 rounded-full text-green-700 hover:bg-green-700 hover:text-white transition">Inquire Now</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Filter functionality
    const filterButtons = document.querySelectorAll('.filter-btn');
    const productGrid = document.getElementById('productGrid');
    const products = productGrid.children;

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filterButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        const filter = button.getAttribute('data-filter');

        for (let product of products) {
          if (filter === 'all') {
            product.style.display = 'block';
          } else {
            if (product.classList.contains(filter)) {
              product.style.display = 'block';
            } else {
              product.style.display = 'none';
            }
          }
        }
      });
    });
  </script>
</body>
</html>
