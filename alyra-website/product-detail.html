<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Detail - Alyra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Lora&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Lora', serif;
      background: #e0f2f1; /* ocean green light background */
      color: #004d40; /* ocean green dark */
    }
    .product-image-large {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .size-chart {
      border-collapse: collapse;
      width: 100%;
      margin-top: 1rem;
    }
    .size-chart th, .size-chart td {
      border: 1px solid #00796b;
      padding: 0.5rem;
      text-align: center;
    }
    .size-chart th {
      background-color: #b2dfdb;
      color: #00796b;
    }
    .quantity-input {
      width: 60px;
      text-align: center;
      border: 1px solid #00796b;
      border-radius: 0.375rem;
      padding: 0.25rem;
      font-size: 1rem;
      margin-right: 0.5rem;
    }
    .payment-section {
      margin-top: 2rem;
      padding: 1rem;
      border: 1px solid #00796b;
      border-radius: 0.75rem;
      background-color: #b2dfdb;
    }
</style>
</head>
<body class="bg-gradient-to-b from-teal-100 via-teal-100 to-teal-200 min-h-screen">
  <header class="sticky top-0 bg-teal-50 bg-opacity-90 backdrop-blur-md shadow-md z-50">
    <nav class="container mx-auto flex items-center justify-between py-4 px-6">
      <div class="flex items-center space-x-3">
        <img src="assets/image/logo.png" alt="Alyra Logo" class="h-12 w-12 object-contain" />
        <div class="text-3xl font-dm-serif font-semibold text-teal-800 select-none">ALYRA</div>
      </div>
      <ul class="flex space-x-8 text-teal-700 font-semibold text-lg">
        <li><a href="index.html#home" class="flex items-center space-x-2"><i class="fas fa-home"></i><span>Home</span></a></li>
        <li><a href="about.html" class="flex items-center space-x-2"><i class="fas fa-info-circle"></i><span>About</span></a></li>
        <li><a href="collection.html" class="flex items-center space-x-2"><i class="fas fa-tshirt"></i><span>Collection</span></a></li>
        <li><a href="sustainability.html" class="flex items-center space-x-2"><i class="fas fa-leaf"></i><span>Sustainability</span></a></li>
        <li><a href="contact.html" class="flex items-center space-x-2"><i class="fas fa-envelope"></i><span>Contact</span></a></li>
        <li><a href="cart.html" class="flex items-center space-x-2"><i class="fas fa-shopping-cart"></i><span>Cart</span></a></li>
      </ul>
    </nav>
  </header>

  <main class="container mx-auto px-6 py-12 max-w-4xl">
    <button onclick="window.history.back()" class="mb-6 px-4 py-2 bg-green-700 text-white rounded hover:bg-green-800 transition">Back to Collection</button>
    <div id="productDetail" class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <img id="productImage" src="" alt="" class="product-image-large" />
      <div>
        <h1 id="productName" class="text-4xl font-dm-serif text-ocean-teal mb-4"></h1>
        <p id="productDescription" class="mb-6 text-green-700"></p>
        <h2 class="text-2xl font-semibold text-green-800 mb-2">Size Chart</h2>
        <table class="size-chart" id="sizeChart">
          <thead>
            <tr>
              <th>Size</th>
              <th>Bust (inches)</th>
              <th>Waist (inches)</th>
              <th>Hip (inches)</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
        <h2 class="text-2xl font-semibold text-green-800 mt-6 mb-2">Fabric Composition</h2>
        <p id="fabricComposition" class="text-green-700"></p>

        <div class="mt-6 flex items-center">
          <label for="quantity" class="mr-2 font-semibold text-green-800">Quantity:</label>
          <input type="number" id="quantity" class="quantity-input" value="1" min="1" />
        </div>

        <button id="addToCartBtn" class="mt-6 px-6 py-3 bg-ocean-teal text-sand-200 font-semibold rounded-full hover:bg-ocean-teal/80 transition">Add to Cart</button>

        <div class="payment-section hidden" id="paymentSection">
          <h2 class="text-2xl font-semibold text-green-800 mb-4">Payment</h2>
          <p class="mb-4">This is a placeholder for payment gateway integration.</p>
          <button id="payNowBtn" class="px-6 py-3 bg-green-700 text-white rounded hover:bg-green-800 transition">Pay Now</button>
        </div>

        <div id="cartMessage" class="mt-4 text-green-700 font-semibold"></div>
      </div>
    </div>
  </main>

  <script>
    const products = {
      "ocean-breeze-dress": {
        name: "Ocean Breeze Dress",
        image: "assets/image/dress1.jpg",
        description: "A flowing dress inspired by the ocean breeze, made from sustainable algae-based fabric.",
        sizeChart: [
          { size: "S", bust: 34, waist: 26, hip: 36 },
          { size: "M", bust: 36, waist: 28, hip: 38 },
          { size: "L", bust: 38, waist: 30, hip: 40 }
        ],
        fabricComposition: "70% Algae Fiber, 30% Organic Cotton"
      },
      "algae-flow-dress": {
        name: "Algae Flow Dress",
        image: "assets/image/kaftan1.jpg",
        description: "Elegant dress with a flowing silhouette, crafted from innovative algae textiles.",
        sizeChart: [
          { size: "S", bust: 33, waist: 25, hip: 35 },
          { size: "M", bust: 35, waist: 27, hip: 37 },
          { size: "L", bust: 37, waist: 29, hip: 39 }
        ],
        fabricComposition: "65% Algae Fiber, 35% Recycled Polyester"
      },
      "seafoam-breeze-top": {
        name: "Seafoam Breeze Top",
        image: "assets/image/top1.jpg",
        description: "Lightweight top inspired by seafoam, perfect for sustainable summer style.",
        sizeChart: [
          { size: "S", bust: 32, waist: 24, hip: 34 },
          { size: "M", bust: 34, waist: 26, hip: 36 },
          { size: "L", bust: 36, waist: 28, hip: 38 }
        ],
        fabricComposition: "60% Algae Fiber, 40% Organic Linen"
      },
      "coral-reef-dress": {
        name: "Coral Reef Dress",
        image: "assets/image/team1.jpg",
        description: "Vibrant dress inspired by coral reefs, made with eco-friendly algae fabric.",
        sizeChart: [
          { size: "S", bust: 35, waist: 27, hip: 37 },
          { size: "M", bust: 37, waist: 29, hip: 39 },
          { size: "L", bust: 39, waist: 31, hip: 41 }
        ],
        fabricComposition: "70% Algae Fiber, 30% Hemp"
      },
      "algae-bloom-dress": {
        name: "Algae Bloom Dress",
        image: "assets/image/team2.jpg",
        description: "Floral-inspired dress with sustainable algae fabric blend.",
        sizeChart: [
          { size: "S", bust: 33, waist: 25, hip: 35 },
          { size: "M", bust: 35, waist: 27, hip: 37 },
          { size: "L", bust: 37, waist: 29, hip: 39 }
        ],
        fabricComposition: "68% Algae Fiber, 32% Organic Cotton"
      },
      "seaside-serenity-dress": {
        name: "Seaside Serenity Dress",
        image: "assets/image/team3.jpg",
        description: "Calming dress inspired by seaside serenity, crafted with algae-based textiles.",
        sizeChart: [
          { size: "S", bust: 34, waist: 26, hip: 36 },
          { size: "M", bust: 36, waist: 28, hip: 38 },
          { size: "L", bust: 38, waist: 30, hip: 40 }
        ],
        fabricComposition: "70% Algae Fiber, 30% Recycled Polyester"
      },
      "ocean-mist-dress": {
        name: "Ocean Mist Dress",
        image: "assets/image/blog1.jpg",
        description: "Mist-inspired dress with a soft algae fabric blend for comfort and style.",
        sizeChart: [
          { size: "S", bust: 33, waist: 25, hip: 35 },
          { size: "M", bust: 35, waist: 27, hip: 37 },
          { size: "L", bust: 37, waist: 29, hip: 39 }
        ],
        fabricComposition: "65% Algae Fiber, 35% Organic Linen"
      },
      "tidal-wave-dress": {
        name: "Tidal Wave Dress",
        image: "assets/image/blog2.jpg",
        description: "Dynamic dress inspired by tidal waves, made with sustainable algae textiles.",
        sizeChart: [
          { size: "S", bust: 34, waist: 26, hip: 36 },
          { size: "M", bust: 36, waist: 28, hip: 38 },
          { size: "L", bust: 38, waist: 30, hip: 40 }
        ],
        fabricComposition: "70% Algae Fiber, 30% Organic Cotton"
      }
    };

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function populateProductDetails(productKey) {
      const product = products[productKey];
      if (!product) {
        document.getElementById('productDetail').innerHTML = '<p class="text-red-600 text-center">Product not found.</p>';
        return;
      }
      document.getElementById('productImage').src = product.image;
      document.getElementById('productImage').alt = product.name;
      document.getElementById('productName').textContent = product.name;
      document.getElementById('productDescription').textContent = product.description;
      document.getElementById('fabricComposition').textContent = product.fabricComposition;

      const tbody = document.getElementById('sizeChart').querySelector('tbody');
      tbody.innerHTML = '';
      product.sizeChart.forEach(size => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${size.size}</td><td>${size.bust}</td><td>${size.waist}</td><td>${size.hip}</td>`;
        tbody.appendChild(row);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const productKey = getQueryParam('product');
      populateProductDetails(productKey);

      const addToCartBtn = document.getElementById('addToCartBtn');
      const quantityInput = document.getElementById('quantity');
      const paymentSection = document.getElementById('paymentSection');
      const cartMessage = document.getElementById('cartMessage');

      addToCartBtn.addEventListener('click', () => {
        const quantity = parseInt(quantityInput.value);
        if (isNaN(quantity) || quantity < 1) {
          alert('Please enter a valid quantity.');
          return;
        }
        // Simulate adding to cart (could be extended to use localStorage or backend)
        cartMessage.textContent = `${quantity} x ${products[productKey].name} added to cart.`;
        paymentSection.classList.remove('hidden');
      });

      const payNowBtn = document.getElementById('payNowBtn');
      payNowBtn.addEventListener('click', () => {
        alert('Payment gateway integration coming soon!');
      });
    });
  </script>
</body>
</html>
